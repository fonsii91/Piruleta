<div class="contenedor-semaforos">
@for(i of repeticiones;track i){


    <div class="cajita">

        @if(contador()>=2){
        <div class="circulo rojo"></div>
        }@else {
        <div class="circulo gris"></div>      
        }
        
        
        @if(contador()==1){
        <div class="circulo naranja"></div>
        }@else {
        <div class="circulo gris"></div>     
        }
        
        
        @if(contador()==0) {
        <div class="circulo verde"></div>
        }@else {
        <div class="circulo gris"></div>      
        }
    </div>
}
</div>
<h1 [style.color]="colorin()"> {{ contador() }}</h1>

<button matButton="elevated" (click)="incrementar()">+1</button>
<button matButton="elevated" (click)="decrementar()">-1</button>
<button matButton="elevated" (click)="resetear()">Reset</button>
